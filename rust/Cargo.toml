[package]
name = "wandstrike_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master" }

# Build with: cargo build
# The .dll/.so goes to rust/bin/ and is loaded via extensions/wandstrike_rust.gdextension
# Start here for: hitreg, movement math, spell ballistics (port from GDScript once stable).
